---
# ── Shared logging configuration ───────────────────────────────────────────────
# Applied to every service via the x-logging anchor. Caps stdout log disk usage
# and provides Docker-managed rotation for services without their own log files
# (redis, trivy-server).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner
      POSTGRES_DB: scanner
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./logs:/var/log/app
    # Write logs to /var/log/app/postgres-YYYY-MM-DD.log on the host mount.
    command: >
      postgres
        -c logging_collector=on
        -c log_directory=/var/log/app
        -c log_filename=postgres-%Y-%m-%d.log
        -c log_min_messages=info
        -c log_rotation_age=1d
        -c log_rotation_size=100MB
        -c log_truncate_on_rotation=on
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "scanner", "-d", "scanner"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # --logfile "" → Redis logs to stdout only (no built-in rotation support).
    # Rotation is handled by the json-file logging driver above.
    command: redis-server --logfile "" --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Trivy server ────────────────────────────────────────────────────────────
  trivy-server:
    image: aquasec/trivy:0.70.0
    restart: unless-stopped
    logging: *default-logging
    command: server --listen 0.0.0.0:8080
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - trivy_cache:/root/.cache/
    healthcheck:
      # On first boot Trivy downloads the vulnerability DB (~several hundred MB).
      # start_period: 5m prevents Docker from marking it unhealthy during the download
      # and restart-looping the bullmq container.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m

  # ── API (Express) ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: api-runtime
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    environment:
      SERVICE_NAME: api
      NODE_ENV: production
      DATABASE_URL: postgresql://scanner:scanner@postgres:5432/scanner
      REDIS_URL: redis://redis:6379
      TRIVY_SERVER_URL: http://trivy-server:8080
      SCAN_INTERVAL_MS: "900000"
      PORT: "3000"
      LOG_LEVEL: info
      LOG_DIR: /var/log/app
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── BullMQ worker ───────────────────────────────────────────────────────────
  bullmq:
    build:
      context: .
      target: bullmq-runtime
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    environment:
      SERVICE_NAME: bullmq
      NODE_ENV: production
      DATABASE_URL: postgresql://scanner:scanner@postgres:5432/scanner
      REDIS_URL: redis://redis:6379
      TRIVY_SERVER_URL: http://trivy-server:8080
      SCAN_INTERVAL_MS: "900000"
      PORT: "3001"
      LOG_LEVEL: info
      LOG_DIR: /var/log/app
    volumes:
      - ./logs:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      trivy-server:
        condition: service_healthy
    # Liveness: process exists and responds to node --version (not a real health
    # check — BullMQ workers have no HTTP port). Docker restarts on crash.
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pg_data:
  redis_data:
  trivy_cache:
